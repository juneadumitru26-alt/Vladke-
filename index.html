<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ты меня любишь?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  body {
    background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ff6fa5, #ffb6d9);
    background-size: 400% 400%;
    animation: gradientShift 10s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .heart {
    position: absolute;
    top: -50px;
    font-size: 24px;
    color: rgba(255,255,255,0.85);
    animation: fall linear infinite;
    pointer-events: none;
    user-select: none;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
  }

  .page {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 5;
    padding: 20px;
    animation: popIn 0.5s ease;
  }
  .page.active { display: flex; }

  @keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  h1 {
    color: #fff;
    font-size: clamp(28px, 6vw, 56px);
    text-shadow: 0 4px 20px rgba(220, 20, 90, 0.4), 0 0 2px rgba(255,255,255,0.8);
    margin-bottom: 40px;
    letter-spacing: 1px;
  }

  .buttons {
    position: relative;
    display: flex;
    gap: 30px;
    justify-content: center;
    align-items: center;
    min-height: 100px;
    width: 100%;
  }

  button {
    font-size: 22px;
    font-weight: bold;
    padding: 18px 48px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  #yesBtn {
    background: linear-gradient(135deg, #ff5c8d, #ff2e63);
    color: white;
  }
  #yesBtn:hover {
    transform: scale(1.08);
    box-shadow: 0 10px 25px rgba(255, 46, 99, 0.5);
  }

  #noBtn {
    background: #ffffff;
    color: #ff2e63;
    position: absolute;
    transition: left 0.15s ease, top 0.15s ease, transform 0.15s ease;
  }

  .yes-size {
    transition: font-size 0.2s ease, padding 0.2s ease;
  }

  #photoImg {
    max-width: 320px;
    width: 80vw;
    border-radius: 20px;
    margin-top: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    border: 6px solid white;
  }

  .subtext {
    color: #fff;
    margin-top: 20px;
    font-size: 18px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>

<div id="heartsContainer"></div>

<div class="page active" id="page1">
  <h1>Ты меня любишь? 💗</h1>
  <div class="buttons" id="buttonsWrap">
    <button id="yesBtn" class="yes-size">Да</button>
    <button id="noBtn">Нет</button>
  </div>
</div>

  <p class="subtext">навсегда твой ❤️</p>
</div>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const wrap = document.getElementById('buttonsWrap');
  let dodgeCount = 0;

  function moveNoButton(e) {
    const wrapRect = wrap.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    const margin = 10;
    const maxLeft = wrapRect.width - btnRect.width - margin;
    const maxTop = 140 - btnRect.height; // vertical wander range

    let newLeft = Math.random() * Math.max(maxLeft, 0);
    let newTop = (Math.random() * Math.max(maxTop, 0)) - 40;

    noBtn.style.left = newLeft + 'px';
    noBtn.style.top = newTop + 'px';

    dodgeCount++;
    // Yes button grows a little each time to add fun pressure
    const scale = Math.min(1 + dodgeCount * 0.05, 1.8);
    yesBtn.style.fontSize = (22 * scale) + 'px';
    yesBtn.style.padding = (18 * scale) + 'px ' + (48 * scale) + 'px';
  }

  // Initialize position
  window.addEventListener('load', () => {
    noBtn.style.position = 'absolute';
    noBtn.style.left = '160px';
    noBtn.style.top = '0px';
  });

  noBtn.addEventListener('mouseenter', moveNoButton);
  noBtn.addEventListener('mousemove', moveNoButton);
  noBtn.addEventListener('click', (e) => {
    e.preventDefault();
    moveNoButton(e);
  });
  // touch support (mobile): dodge on touchstart near it
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    moveNoButton(e);
  }, { passive: false });

  yesBtn.addEventListener('click', () => {
    document.getElementById('page1').classList.remove('active');
    document.getElementById('page2').classList.add('active');
  });

  // Floating hearts background
  const heartsContainer = document.getElementById('heartsContainer');
  const heartSymbols = ['💗','💖','💕','❤️','💓'];
  function spawnHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (16 + Math.random() * 20) + 'px';
    heart.style.animationDuration = (6 + Math.random() * 6) + 's';
    heartsContainer.appendChild(heart);
    setTimeout(() => heart.remove(), 13000);
  }
  setInterval(spawnHeart, 500);
</script>
